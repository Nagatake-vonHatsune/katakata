  <path d="M86 62c2-4 5-7 9-8" stroke="#f1e6cf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- ear -->
  <path d="M93 41c-2-8 1-14 6-15 2 6 0 12-3 16z" fill="#7a4a26"/>
  <path d="M95 39c-1-5 1-9 3-10 1 4 0 7-2 10z" fill="#e7b48a"/>
  <!-- eye + nose -->
