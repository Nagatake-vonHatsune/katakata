  <!-- legs -->
  <g stroke="#7a4a26" stroke-width="4.5" stroke-linecap="round">
    <line x1="47" y1="80" x2="44" y2="99"/>
    <line x1="55" y1="81" x2="56" y2="99"/>
    <line x1="76" y1="80" x2="74" y2="99"/>
    <line x1="83" y1="78" x2="87" y2="98"/>
  </g>
  <!-- body -->
  <path d="M38 72c0-12 12-20 28-20s25 6 25 18-10 15-26 15-27-2-27-13z" fill="#a8693a"/>
  <path d="M44 78c6 4 30 5 42-1" stroke="#f1e6cf" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- tail -->
  <path d="M38 68c-4-1-6 1-6 4" stroke="#7a4a26" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- neck + head -->
