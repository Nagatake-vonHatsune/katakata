  <circle cx="100.9" cy="45.2" r="0.8" fill="#fff"/>
  <circle cx="106.5" cy="50" r="1.6" fill="#1d1d1b"/>
  <!-- leaf: "satu kata, satu langkah" -->
  <path d="M24 46c6-10 18-12 22-8-4 8-14 12-22 8z" fill="#6aa84f"/>
  <path d="M25 46c7-2 13-5 19-8" stroke="#2f6b4f" stroke-width="1.4" fill="none"/>
